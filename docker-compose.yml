services:
  backend:
    build:
      context: ./backend
    container_name: hype-news-hub-backend
    restart: unless-stopped
    environment:
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://localhost:5173,https://hype-news-hub.vercel.app
      NEWS_STORAGE_BACKEND: ${NEWS_STORAGE_BACKEND:-memory}
      STORY_MATCH_MAX_GAP_HOURS: ${STORY_MATCH_MAX_GAP_HOURS:-48}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-hype_news_hub}
      POSTGRES_USER: ${POSTGRES_RUNTIME_USER:-hype_news_hub_runtime}
      POSTGRES_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - hype-news-hub
      - database

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hype_news_hub}
      POSTGRES_USER: ${POSTGRES_USER:-hype_news_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - database

  migrate:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile.database
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-hype_news_hub}
      POSTGRES_USER: ${POSTGRES_USER:-hype_news_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database

  provision-runtime:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile.database
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-hype_news_hub}
      POSTGRES_USER: ${POSTGRES_USER:-hype_news_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-hype_news_hub_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
    command: ["python", "-B", "-m", "app.database.runtime_security"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database

  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hype_news_hub_test
      POSTGRES_USER: hype_news_hub_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-}
      TZ: UTC
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - database-test

  database-tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile.database
    environment:
      RUN_POSTGRES_TESTS: "1"
      POSTGRES_HOST: postgres-test
      POSTGRES_DB: hype_news_hub_test
      POSTGRES_USER: hype_news_hub_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-}
      POSTGRES_SSLMODE: disable
    volumes:
      - ./backend/tests:/app/tests:ro
      - ./backend/.env.example:/app/.env.example:ro
    command: ["python", "-B", "-m", "unittest", "discover", "-s", "tests", "-v"]
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - database-test

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: hype-news-hub-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http'); http.get('http://127.0.0.1:3000', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - hype-news-hub

networks:
  hype-news-hub:
    driver: bridge
  database:
    driver: bridge
    internal: true
  database-test:
    driver: bridge
    internal: true

volumes:
  postgres-data:
