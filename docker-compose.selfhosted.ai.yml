# Explicit optional overlay. Base composition remains AI-disabled.
# Apply AFTER the base and any host-proxy overlay, only after administrator review.
services:
  news-api:
    environment:
      AI_PROCESSING_PROVIDER: gemini
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      GEMINI_MODEL: ${HNW_GEMINI_MODEL:?Select and verify an available structured-output model}
      GEMINI_MAX_INPUT_TOKENS: ${HNW_GEMINI_MAX_INPUT_TOKENS:-4096}
      GEMINI_MAX_OUTPUT_TOKENS: ${HNW_GEMINI_MAX_OUTPUT_TOKENS:-2048}
      GEMINI_SAFE_RETRIES: "0"
      AI_PROCESSING_TIMEOUT_SECONDS: "30"
      AI_DAILY_GENERATION_LIMIT: ${HNW_AI_DAILY_GENERATION_LIMIT:-10}
    secrets: [gemini_api_key]
secrets:
  gemini_api_key:
    file: ${HNW_GEMINI_API_KEY_FILE:?Set an absolute protected Gemini key file path}
